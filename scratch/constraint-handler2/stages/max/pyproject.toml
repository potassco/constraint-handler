[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "constraint-handler"
version = "0.1.0"
description = "A Python constraint-handling library."
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["nox", "pre-commit", "pyright", "pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--cov=constraint_handler", "--cov-branch", "--cov-report=term-missing"]

[tool.pyright]
include = ["src", "tests", "noxfile.py"]
pythonVersion = "3.15"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]